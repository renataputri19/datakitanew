user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Global upload ceiling — intentionally generous so future features
    # (video, large Excel imports, etc.) are not blocked at the nginx layer.
    # Per-feature size limits are enforced by Laravel validation rules.
    # client_body_temp_path uses /tmp so nginx can always buffer large request
    # bodies without needing special permissions on /var/lib/nginx/tmp.
    client_max_body_size      64M;
    client_body_buffer_size    1M;
    client_body_temp_path     /tmp/nginx_client_body 1 2;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Trust Dokploy / Traefik proxy headers
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/http.d/*.conf;
}
